name: Student Registration CI & Deployment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-webpage:
    name: Verify HTML File & Form Elements
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check HTML File Existence
        run: |
          echo "Checking whether index.html exists in root directory..."
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi
          echo "SUCCESS: index.html is present."

      - name: Run Automated HTML Elements Test (Python)
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Automated HTML Elements Test (Node.js)
        run: |
          node tests/test_html.js

      - name: Execute Full Test Runner
        run: |
          chmod +x run_tests.sh
          ./run_tests.sh

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: validate-webpage
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
